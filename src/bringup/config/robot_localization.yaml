ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    two_d_mode: true
    publish_tf: true
    
    # --- DIE WICHTIGSTE ÄNDERUNG ---
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom  # <-- Jetzt baut der EKF den odom->base_link Baumstamm auf!
    # -------------------------------

    odom0: /odometry/gps
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    imu0: /imu/data 
    # Config Matrix: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    imu0_config: [false, false, false,  # Position (do not use from IMU)
                  false, false, true,   # Orientation 
                  false, false, false,  # Velocity (do not use)
                  false, false, false,  # Angular Velocity 
                  false, false, false]  # Acceleration 

navsat_transform_node:
  ros__parameters:
    frequency: 10.0
    
    # Datum / Transform Settings
    wait_for_datum: false
    delay: 0.0
    
    # Magnetic/Angle Settings
    magnetic_declination_radians: 0.053
    yaw_offset: 1.570796327
    zero_altitude: true
    
    # Input Settings
    use_odometry_yaw: false  # Use IMU directly
    
    # Output Settings
    broadcast_cartesian_transform: true  # REPLACES broadcast_utm_transform
    publish_filtered_gps: true
    
    # Frame IDs (Must match your static transforms!)
    base_link_frame: base_link
    gps_frame: gps          # Default is '', must match child_frame_id of static_tf
    
    # Failure Prevention
    transform_timeout: 0.0