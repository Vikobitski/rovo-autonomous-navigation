controller_server:
  ros__parameters:
    use_sim_time: True # Auf False setzen, wenn echte Hardware
    controller_plugins: ["FollowPath"]
    publish_twist_stamped: True # Important for rovo_driver
    
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_velocity: 0.5   # Maximale Geschwindigkeit (m/s)
      lookahead_dist: 0.5            # Wichtig: Wie weit er "vorausplant"
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      
      # Differential-Drive Spezifika:
      use_rotate_to_heading: true    # Dreht sich am Start erst zum Pfad
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.0
      
      # Sicherheit:
      regulated_linear_velocity_scaling_parameter: 2.0 # Bremst in Kurven ab
      use_costmap_constraints: false # Setze auf True, wenn er Hindernisse beachten soll