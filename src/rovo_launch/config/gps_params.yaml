# config/zedf9p_i2c_config.yaml

# # Parameter für den ublox_dgnss_node
# ublox_gps_node:
#   ros__parameters:

#     # --- 1. Verbindungsparameter (Das Wichtigste!) ---
    
#     # Port: Für I2C muss dies der Pfad zum I2C-Bus sein.
#     # Auf dem Raspberry Pi ist dies fast immer /dev/i2c-1
#     port: /dev/i2c-1

#     # Frame ID für alle veröffentlichten ROS-Nachrichten
#     frame_id: "gps"

    
#     # --- 2. Modul-Konfiguration (Wird beim Start gesetzt) ---
    
#     # Sagt dem Treiber, dass er das Modul konfigurieren soll
#     config_on_startup: true

#     # Setze das dynamische Modell (wichtig für Genauigkeit)
#     # "portable" ist gut für Gehen/langsame Fahrzeuge.
#     # Andere Optionen: "stationary", "pedestrian", "automotive"
#     tmode:
#       dyn_model: "portable"


#     # --- 3. I2C-Port-Einstellungen (Wird vom Treiber konfiguriert) ---
    
#     # Der Treiber MUSS den ZED-F9P anweisen, UBX über I2C zu sprechen.
#     # Wir deaktivieren NMEA explizit, um Bandbreite zu sparen.
#     i2c:
#       in_proto_ubx: true
#       in_proto_nmea: false
#       in_proto_rtcm3x: false # RTCM ist für RTK-Korrekturen (separates Thema)
#       out_proto_ubx: true
#       out_proto_nmea: false


#     # --- 4. Nachrichten-Raten (Was wir lesen wollen) ---
    
#     # Wir brauchen Position, Geschwindigkeit, Höhe, Ausrichtung.
#     # NAV-PVT (0x01-0x07) liefert all das.
#     # Wir setzen die Rate auf 1 Hz. (Erhöhen Sie auf 5 oder 10 für schnellere Updates)
#     rate:
#       nav_pvt: 1  # 1 Hz


#     # --- 5. Nachrichten Veröffentlichen (Topics) ---
    
#     # Stellen Sie sicher, dass die Topics veröffentlicht werden,
#     # die Sie benötigen.
#     publish:
#       all: false           # Erstmal alles deaktivieren
      
#       # Diese Nachricht enthält ALLES, was Sie angefordert haben:
#       # Position, Höhe, Geschwindigkeit, Ausrichtung (headMot)
#       nav_pvt: true        # Publiziert /navpvt (ublox_msgs/msg/NavPVT)

#       # Dies ist das Standard-ROS-GPS-Format (empfohlen)
#       fix: true            # Publiziert /fix (sensor_msgs/msg/NavSatFix)

#       # Dies ist das Standard-ROS-Geschwindigkeitsformat
#       vel: true            # Publiziert /vel (geometry_msgs/msg/TwistWithCovarianceStamped)