<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>ROS 2 Robot Map UI</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>

<style>
  body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
  #map { height: 100vh; width: 100vw; }
  #status-overlay {
    position: absolute;
    top: 10px;
    left: 10px;
    background-color: rgba(255, 255, 255, 0.8);
    padding: 10px;
    border-radius: 5px;
    z-index: 1000; /* Stellt sicher, dass es über der Karte liegt */
  }
  #data-overlay {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background-color: rgba(255, 255, 255, 0.8);
    padding: 10px;
    border-radius: 5px;
    z-index: 1000;
  }
  #command-buttons {
    position: absolute;
    bottom: 10px;
    right: 10px;
    z-index: 1000;
    background-color: rgba(255, 255, 255, 0.8);
    padding: 10px;
    border-radius: 5px;
  }
  
  /* NEU: Stil für den unsichtbaren Leaflet-Container */
  .robot-div-icon {
    background: none;
    border: none;
  }

  /* Stil für unser rotierendes Icon (bleibt gleich) */
  .robot-icon {
    width: 32px; /* Größe deines Bildes */
    height: 32px; /* Größe deines Bildes */
    /* CSS-Trick, um den Drehpunkt in die Mitte zu legen */
    transform-origin: center center; 
  }
</style>
</head>

<body>
  <div id="map"></div>

  <div id="status-overlay">
    <strong>ROS-Verbindungsstatus:</strong> <span id="status">Wird verbunden...</span><br>
    <strong>Robot-Status:</strong> <span id="robot-status">Warte auf Daten...</span>
  </div>

  <div id="data-overlay">
    <h3>Aktuelle Daten:</h3>
    <p><strong>Lat:</strong> <span id="current-lat">N/A</span></p>
    <p><strong>Lon:</strong> <span id="current-lon">N/A</span></p>
    <p><strong>Heading:</strong> <span id="current-heading">N/A</span>&deg;</p>
    <p><strong>GPS Fix Mode:</strong> <span id="rtk-status" style="font-weight: bold;">N/A</span></p>
    <p><strong>BNO085 Status:</strong> <span id="bno-status" style="font-weight: bold;">N/A</span></p>
  </div>
  
  <div id="command-buttons">
    <h3>Befehle senden:</h3>
    <button onclick="sendCommand('START')">Start</button>
    <button onclick="sendCommand('STOP')">Stopp</button>
    <button onclick="zoomToRobot()">Zoom auf Roboter</button>
  </div>

<script type="text/javascript">
  
  // === 1. ROS-Verbindung aufbauen ===
  var rosbridgeHost = window.location.hostname;
  var ros = new ROSLIB.Ros({
    url : 'ws://' + rosbridgeHost + ':9090'
  });

  ros.on('connection', function() {
    console.log('Verbunden mit ROS-WebSocket-Server.');
    document.getElementById('status').innerHTML = '<span style="color: green;">Verbunden</span>';
  });

  ros.on('error', function(error) {
    console.log('Fehler bei der Verbindung: ', error);
    document.getElementById('status').innerHTML = '<span style="color: red;">Fehler!</span>';
  });

  ros.on('close', function() {
    console.log('Verbindung getrennt.');
    document.getElementById('status').innerHTML = '<span style="color: orange;">Getrennt</span>';
  });

  // === 2. Karteninitialisierung ===
  const INITIAL_LAT = 48.4011; 
  const INITIAL_LON = 9.9877; 
  const INITIAL_ZOOM = 18;
  var map = L.map('map').setView([INITIAL_LAT, INITIAL_LON], INITIAL_ZOOM);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // === Icon für den Roboter erstellen (MODIFIZIERT) ===
  
  // Wir benutzen L.divIcon. Leaflet positioniert den 'robot-div-icon'-Container.
  // Wir rotieren nur das 'robot-icon'-Bild *innerhalb* dieses Containers.
  var robotMarker = L.marker([INITIAL_LAT, INITIAL_LON], {
      icon: L.divIcon({
          className: 'robot-div-icon', // Klasse für den äußeren Container
          html: '<img src="RovoIcon.png" class="robot-icon">', // Unser Bild im Container
          iconSize: [32, 32],
          iconAnchor: [16, 16]
      })
  }).addTo(map);

  // Greife auf das Bild-Element zu, das wir rotieren wollen
  var robotIconImg = robotMarker._icon.querySelector('.robot-icon');
  var currentHeading = 0;

  // === 3. ROS-Topics abonnieren ===

  // 3.1 IMU-Daten (Orientierung)
  var imuTopic = new ROSLIB.Topic({
    ros : ros,
    name : '/imu/data',
    messageType : 'sensor_msgs/Imu'
  });

  imuTopic.subscribe(function(message) {
    var q = message.orientation;
    var siny_cosp = 2 * (q.w * q.z + q.x * q.y);
    var cosy_cosp = 1 - 2 * (q.y * q.y + q.z * q.z);
    
    var yawRad = Math.atan2(siny_cosp, cosy_cosp);
    var yawDeg = yawRad * (180 / Math.PI); 

    let displayHeading = (90 - yawDeg);
    displayHeading = (displayHeading + 360) % 360; 

    currentHeading = displayHeading;
    
    // Rotiere das <img>-Element (wird nicht mehr von Leaflet überschrieben)
    if (robotIconImg) {
        robotIconImg.style.transform = `rotate(${currentHeading}deg)`;
    }
    document.getElementById('current-heading').innerHTML = currentHeading.toFixed(1);
  });

  // 3.2 GPS-Daten (Position)
  var gpsTopic = new ROSLIB.Topic({
    ros : ros,
    name : '/fix',
    messageType : 'sensor_msgs/NavSatFix'
  });
  gpsTopic.subscribe(function(message) {
    var lat = message.latitude;
    var lon = message.longitude;
    robotMarker.setLatLng([lat, lon]);
    document.getElementById('current-lat').innerHTML = lat.toFixed(6);
    document.getElementById('current-lon').innerHTML = lon.toFixed(6);
    document.getElementById('robot-status').innerHTML = '<span style="color: blue;">Alle Daten empfangen</span>';
  });

  // === 4. BNO085 Kalibrierungs-Status ===
  var diagTopic = new ROSLIB.Topic({
    ros : ros,
    name : '/diagnostics',
    messageType : 'diagnostic_msgs/DiagnosticArray'
  });
  diagTopic.subscribe(function(message) {
    var bnoStatusMsg = message.status.find(s => s.name.includes('Calibration Status'));
    if (bnoStatusMsg) {
      var calibValue = bnoStatusMsg.values.find(v => v.key === 'System Calibration').value;
      var statusText = 'Unknown';
      switch(calibValue) {
          case '0': statusText = '<span style="color: red;">Unreliable (0)</span>'; break;
          case '1': statusText = '<span style="color: orange;">Low Acc (1)</span>'; break;
          case '2': statusText = '<span style="color: blue;">Medium Acc (2)</span>'; break;
          case '3': statusText = '<span style="color: green;">Full Acc (3)</span>'; break;
      }
      document.getElementById('bno-status').innerHTML = statusText;
    }
  });

  // === 5. RTK Fix Mode Status (mit ublox_msgs) ===
  var navPvtTopic = new ROSLIB.Topic({
      ros: ros,
      name: '/navpvt', 
      messageType: 'ublox_msgs/NavPVT'
  });
  navPvtTopic.subscribe(function(message) {
      var fixType = message.fix_type;
      var flags2 = message.flags2;
      var carrSoln = (flags2 >> 6) & 0x03; 
      var statusText = 'Unknown';
      var color = 'black';

      if (carrSoln === 2) {
          statusText = 'RTK Fixed';
          color = 'green';
      } else if (carrSoln === 1) {
          statusText = 'RTK Float';
          color = 'blue';
      } else {
          switch(fixType) {
              case 0: statusText = 'No Fix'; color = 'red'; break;
              case 1: statusText = 'Dead Reckoning'; color = 'orange'; break;
              case 2: statusText = '2D Fix'; color = 'orange'; break;
              case 3: statusText = '3D Fix'; color = 'blue'; break;
              case 4: statusText = 'GNSS + DR'; color = 'blue'; break;
              case 5: statusText = 'Time Fix Only'; color = 'orange'; break;
              default: statusText = `Unknown (${fixType})`; color = 'red';
          }
      }
      document.getElementById('rtk-status').innerHTML = `<span style="color: ${color};">${statusText}</span>`;
  });

  // === 6. Befehle senden (Button-Klick) ===
  var cmdTopic = new ROSLIB.Topic({
    ros : ros,
    name : '/web_command',
    messageType : 'std_msgs/String'
  });

  function sendCommand(commandName) {
    var msg = new ROSLIB.Message({
      data : commandName 
    });
    console.log('Sende Befehl: ' + msg.data);
    cmdTopic.publish(msg);
  }

  function zoomToRobot() {
    if (robotMarker) {
      var latLng = robotMarker.getLatLng();
      map.flyTo(latLng, 19, {
        animate: true,
        duration: 1.0 
      });
    }
  }

</script>
</body>
</html>
